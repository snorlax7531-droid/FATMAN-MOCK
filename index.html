<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FATMAN Mock Test - SSC GK/GS Exam Portal</title>
    <meta name="description" content="FATMAN Mock Test portal featuring TCS exam interface, 60-day study plan, subject & chapter wise mock tests, automated timer, performance analytics, and administrator management." />
    <meta property="og:title" content="FATMAN Mock Test - SSC GK/GS Exam Portal" />
    <meta property="og:description" content="FATMAN Mock Test portal featuring TCS exam interface, 60-day study plan, subject & chapter wise mock tests, automated timer, performance analytics, and administrator management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" crossorigin href="./assets/index.css">
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .app-loader-spinner {
        animation: spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #f8fafc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #1e293b; border-top-color: #db2777; border-radius: 50%;" class="app-loader-spinner"></div>
        <h2 style="font-size: 20px; font-weight: 800; margin-top: 20px; margin-bottom: 6px; color: #ffffff; letter-spacing: -0.02em;">FATMAN Mock Test</h2>
        <p style="font-size: 13px; color: #94a3b8; max-width: 320px; margin: 0; line-height: 1.5;">Preparing TCS Exam Portal & Supabase Sync...</p>
      </div>
    </div>
    <!-- Vite Development Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- Automatic Production Bundle Loader for GitHub Pages main branch -->
    <script>
      (function() {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.port === '3000';
        if (!isLocal) {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/app.js';
          document.head.appendChild(s);
        }
      })();
    </script>
    <script>
      // Diagnostic fail-safe for GitHub Pages deployment
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.querySelector('.app-loader-spinner')) {
          root.innerHTML = '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; color: #f8fafc; font-family: sans-serif; padding: 24px; text-align: center;"><div style="background: #1e293b; border: 1px solid #334155; padding: 28px; border-radius: 16px; max-width: 520px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);"><div style="font-size: 32px; margin-bottom: 12px;">⚠️</div><h2 style="font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #f43f5e;">Loading Issue Detected</h2><p style="font-size: 13px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.6;">If you deployed to GitHub Pages, ensure you are deploying the <b>dist</b> build (via GitHub Actions workflow or "gh-pages" branch), rather than raw uncompiled source files.</p><div style="background: #0f172a; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 11px; color: #fda4af; text-align: left; margin-bottom: 16px; overflow-x: auto;">' + (e.message || 'Script execution error') + '</div><button onclick="window.location.reload()" style="background: #db2777; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">Retry Loading</button></div></div>';
        }
      });
    </script>
  </body>
</html>
